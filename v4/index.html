<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:#555;border-radius:4px;}

<body>
<div id="root" style="height:100vh;"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;

const DEFAULT_STATUSES=[
  {id:"online",   label:"Online",   emoji:"🟢",color:"#1D9E75",bg:"#E1F5EE",dbg:"#04342C"},
  {id:"sleeping", label:"Sleeping", emoji:"😴",color:"#8B7FE8",bg:"#EEEDFE",dbg:"#26215C"},
  {id:"silent",   label:"Silent",   emoji:"🔕",color:"#888780",bg:"#F1EFE8",dbg:"#2C2C2A"},
  {id:"busy",     label:"Busy",     emoji:"🎯",color:"#D85A30",bg:"#FAECE7",dbg:"#4A1B0C"},
  {id:"driving",  label:"Driving",  emoji:"🚗",color:"#378ADD",bg:"#E6F1FB",dbg:"#042C53"},
  {id:"eating",   label:"Eating",   emoji:"🍽️",color:"#BA7517",bg:"#FAEEDA",dbg:"#412402"},
  {id:"away",     label:"Away",     emoji:"📵",color:"#E24B4A",bg:"#FCEBEB",dbg:"#501313"},
  {id:"focusing", label:"Focusing", emoji:"💻",color:"#639922",bg:"#EAF3DE",dbg:"#173404"},
];
const AVATARS=["🐻","🦊","🐼","🐸","🦁","🐯","🐨","🦋","🐬","🦄"];
const EMOJI_OPT=["✨","🎵","🏋️","📚","🌙","☕","🎮","🏠","🌿","💤","🔥","😊","🎯","🌊","🎨","🍕","💪","🧘"];

const auth=()=>window.__auth;
const db=()=>window.__db;
function dbOn(p,cb){const r=db().ref(p);r.on("value",s=>cb(s.val()));return()=>r.off("value");}
async function dbGet(p){return(await db().ref(p).once("value")).val();}
async function dbSet(p,v){await db().ref(p).set(v);}
async function dbPatch(p,v){await db().ref(p).update(v);}
async function dbDel(p){await db().ref(p).remove();}

function timeAgo(ts){
  if(!ts)return"";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<10)return"just now";if(s<60)return s+"s ago";
  if(s<3600)return Math.floor(s/60)+"m ago";return Math.floor(s/3600)+"h ago";
}
function chime(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.type="sine";
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+0.3);
    g.gain.setValueAtTime(0.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
    o.start();o.stop(ctx.currentTime+0.4);
  }catch(e){}
}

function Toast({msg,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  return<div className="fadein" style={{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",padding:"10px 22px",borderRadius:12,fontSize:13,fontWeight:500,zIndex:9999,whiteSpace:"nowrap",background:"#1a1a1a",color:"#fff",boxShadow:"0 6px 24px rgba(0,0,0,.5)"}}>{msg}</div>;
}

function Modal({title,children,onClose,dark,width}){
  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)"}} onClick={onClose}>
    <div className="fadein" onClick={e=>e.stopPropagation()} style={{background:dark?"#1a1a1a":"#fff",border:"0.5px solid "+(dark?"#2e2e2e":"#e0e0e0"),borderRadius:18,padding:"1.5rem",width:width||340,maxWidth:"94vw",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.4)"}}>
      {title&&<h3 style={{fontSize:16,fontWeight:700,marginBottom:16,color:dark?"#f0f0f0":"#111"}}>{title}</h3>}
      {children}
    </div>
  </div>;
}

function Pill({text,color,bg}){
  return<span style={{fontSize:10,background:bg,color,padding:"2px 8px",borderRadius:6,fontWeight:600}}>{text}</span>;
}

function App(){
  const [dark,setDark]=useState(false);
  const [authUser,setAuthUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [profile,setProfile]=useState({name:"",avatar:AVATARS[0]});
  const [globalStatus,setGlobalStatus]=useState("online");
  const [globalNote,setGlobalNote]=useState("");
  const [customStatuses,setCustomStatuses]=useState([]); // user-level custom statuses
  const [rooms,setRooms]=useState({});
  const [activeRoom,setActiveRoom]=useState(null);
  const [screen,setScreen]=useState("home");
  const [waitingRoom,setWaitingRoom]=useState(null);
  const [notifications,setNotifications]=useState([]); // [{id,msg,ts}]
  const [showNotif,setShowNotif]=useState(false);
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  const [modalData,setModalData]=useState({});
  const [sidebarOpen,setSidebarOpen]=useState(true);
  const [connecting,setConnecting]=useState(false);
  const [newCustomLabel,setNewCustomLabel]=useState("");
  const [newCustomEmoji,setNewCustomEmoji]=useState("✨");

  const uidRef=useRef(null);
  const profileRef=useRef(profile);
  const globalStatusRef=useRef(globalStatus);
  const globalNoteRef=useRef(globalNote);
  const customStatusesRef=useRef(customStatuses);
  const roomsRef=useRef(rooms);
  const activeRoomRef=useRef(activeRoom);
  const screenRef=useRef(screen);
  const pollRefs=useRef({});
  const waitUnsubRef=useRef(null);

  useEffect(()=>{profileRef.current=profile;},[profile]);
  useEffect(()=>{globalStatusRef.current=globalStatus;},[globalStatus]);
  useEffect(()=>{globalNoteRef.current=globalNote;},[globalNote]);
  useEffect(()=>{customStatusesRef.current=customStatuses;},[customStatuses]);
  useEffect(()=>{roomsRef.current=rooms;},[rooms]);
  useEffect(()=>{activeRoomRef.current=activeRoom;},[activeRoom]);
  useEffect(()=>{screenRef.current=screen;},[screen]);

  function addNotif(msg){
    chime();
    setNotifications(prev=>[{id:Date.now(),msg,ts:Date.now()},...prev].slice(0,50));
  }

  function allStatuses(){
    return[...DEFAULT_STATUSES,...customStatuses];
  }
  function allStatusesForRoom(code){
    const roomCustom=(rooms[code]&&rooms[code].meta&&rooms[code].meta.customStatuses)||[];
    // merge user custom + room custom (dedupe by id)
    const merged=[...DEFAULT_STATUSES,...customStatuses];
    roomCustom.forEach(s=>{if(!merged.find(m=>m.id===s.id))merged.push(s);});
    return merged;
  }

  useEffect(()=>{
    const unsub=auth().onAuthStateChanged(async user=>{
      setAuthLoading(false);
      if(user){
        setAuthUser(user);uidRef.current=user.uid;
        const saved=await dbGet("/users/"+user.uid);
        const p={name:saved&&saved.name?saved.name:(user.displayName||""),avatar:saved&&saved.avatar?saved.avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)]};
        setProfile(p);profileRef.current=p;
        if(saved&&saved.status)setGlobalStatus(saved.status);
        if(saved&&saved.note)setGlobalNote(saved.note);
        if(saved&&saved.dark)setDark(true);
        if(saved&&saved.customStatuses){setCustomStatuses(saved.customStatuses);customStatusesRef.current=saved.customStatuses;}
        if(saved&&saved.rooms)Object.keys(saved.rooms).forEach(code=>subscribeRoom(code,user.uid));
      }else{
        setAuthUser(null);uidRef.current=null;
        Object.values(pollRefs.current).forEach(u=>u());
        pollRefs.current={};
        setRooms({});setActiveRoom(null);setScreen("home");
      }
    });
    return unsub;
  },[]);

  async function saveUserData(uid,p,status,note,dk,cs){
    await dbPatch("/users/"+uid,{name:p.name,avatar:p.avatar,status,note,dark:dk,customStatuses:cs||[],updatedAt:Date.now()});
  }

  async function signInGoogle(){
    try{await auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());}
    catch(e){setToast("Sign-in failed.");}
  }
  async function signOut(){
    Object.values(pollRefs.current).forEach(u=>u());
    pollRefs.current={};
    if(waitUnsubRef.current){waitUnsubRef.current();waitUnsubRef.current=null;}
    setRooms({});setActiveRoom(null);setScreen("home");setNotifications([]);
    await auth().signOut();
  }

  function subscribeRoom(code,uid){
    if(pollRefs.current[code])return;
    const unsub=dbOn("/rooms/"+code,data=>{
      if(!data){
        setRooms(prev=>{const n={...prev};delete n[code];return n;});
        dbDel("/users/"+uid+"/rooms/"+code);
        if(activeRoomRef.current===code){setActiveRoom(null);setScreen("home");}
        addNotif("Room was closed by admin.");
        return;
      }
      const members=data.members||{};
      const meta=data.meta||{};
      const pending=data.pending||{};
      if(members.__kicked&&members.__kicked[uid]){
        unsub();delete pollRefs.current[code];
        dbDel("/users/"+uid+"/rooms/"+code);
        setRooms(prev=>{const n={...prev};delete n[code];return n;});
        if(activeRoomRef.current===code){setActiveRoom(null);setScreen("home");}
        addNotif("You were removed from "+(meta.roomName||code));
        return;
      }
      setRooms(prev=>{
        const prevRoom=prev[code]||{};
        const prevMembers=prevRoom.members||{};
        const isActive=activeRoomRef.current===code;
        let unread=isActive?0:(prevRoom.unread||0);
        const allSt=[...DEFAULT_STATUSES,...(meta.customStatuses||[]),...customStatusesRef.current];
        Object.keys(members).forEach(id=>{
          const m=members[id];
          if(id!==uid&&id!=="__kicked"&&prevMembers[id]&&prevMembers[id].status!==m.status){
            const f=allSt.find(s=>s.id===m.status);
            const msg=(m.name||"Someone")+" is now "+(f?f.label+" "+f.emoji:m.status)+" in "+(meta.roomName||code);
            addNotif(msg);
            if(isActive)setToast(msg);
            else unread++;
          }
        });
        if(meta.owner===uid){
          const prevPend=prevRoom.pending||{};
          Object.keys(pending).forEach(pid=>{
            if(!prevPend[pid]){
              const msg=(pending[pid].name||"Someone")+" wants to join "+(meta.roomName||code);
              addNotif(msg);setToast(msg);
            }
          });
        }
        return{...prev,[code]:{members,meta,pending,unread,name:meta.roomName||code}};
      });
    });
    pollRefs.current[code]=unsub;
  }

  async function writeMe(code,uid,status,note){
    await dbPatch("/rooms/"+code+"/members/"+uid,{
      name:profileRef.current.name,avatar:profileRef.current.avatar,status,note,ts:Date.now()
    });
  }

  async function updateGlobalStatus(sid){
    setGlobalStatus(sid);globalStatusRef.current=sid;
    const uid=uidRef.current;if(!uid)return;
    await dbPatch("/users/"+uid,{status:sid,updatedAt:Date.now()});
    await Promise.all(Object.keys(roomsRef.current).map(code=>{
      const m=roomsRef.current[code]&&roomsRef.current[code].members&&roomsRef.current[code].members[uid];
      if(m)return writeMe(code,uid,sid,globalNoteRef.current);
      return Promise.resolve();
    }));
  }

  async function updateGlobalNote(note){
    setGlobalNote(note);globalNoteRef.current=note;
    const uid=uidRef.current;if(!uid)return;
    await dbPatch("/users/"+uid,{note,updatedAt:Date.now()});
    await Promise.all(Object.keys(roomsRef.current).map(code=>{
      const m=roomsRef.current[code]&&roomsRef.current[code].members&&roomsRef.current[code].members[uid];
      if(m)return dbPatch("/rooms/"+code+"/members/"+uid,{note,ts:Date.now()});
      return Promise.resolve();
    }));
  }

  async function addUserCustomStatus(){
    if(!newCustomLabel.trim())return;
    const colors=["#1D9E75","#8B7FE8","#D85A30","#378ADD","#BA7517","#E24B4A","#639922","#D4537E"];
    const bgs=["#E1F5EE","#EEEDFE","#FAECE7","#E6F1FB","#FAEEDA","#FCEBEB","#EAF3DE","#FBEAF0"];
    const idx=customStatuses.length%colors.length;
    const ns={id:"u_"+Date.now(),label:newCustomLabel.trim(),emoji:newCustomEmoji,color:colors[idx],bg:bgs[idx],dbg:"#222",custom:true};
    const updated=[...customStatuses,ns];
    setCustomStatuses(updated);customStatusesRef.current=updated;
    await saveUserData(uidRef.current,profileRef.current,globalStatusRef.current,globalNoteRef.current,dark,updated);
    setNewCustomLabel("");setNewCustomEmoji("✨");
    setToast("Custom status added!");
  }

  async function removeUserCustomStatus(id){
    const updated=customStatuses.filter(s=>s.id!==id);
    setCustomStatuses(updated);customStatusesRef.current=updated;
    if(globalStatus===id)await updateGlobalStatus("online");
    await saveUserData(uidRef.current,profileRef.current,globalStatusRef.current,globalNoteRef.current,dark,updated);
  }

  async function createRoom(roomName){
    const uid=uidRef.current;if(!uid)return;
    setConnecting(true);
    const code=Math.random().toString(36).slice(2,8).toUpperCase();
    try{
      await dbSet("/rooms/"+code+"/meta",{owner:uid,roomName:roomName||code,customStatuses:[],createdAt:Date.now()});
      await writeMe(code,uid,globalStatusRef.current,globalNoteRef.current);
      await dbSet("/users/"+uid+"/rooms/"+code,true);
      subscribeRoom(code,uid);
      setActiveRoom(code);setScreen("board");setModal(null);
    }catch(e){setToast("Failed to create room.");}
    setConnecting(false);
  }

  async function requestJoin(code){
    const uid=uidRef.current;if(!uid)return;
    setConnecting(true);
    try{
      const meta=await dbGet("/rooms/"+code+"/meta");
      if(!meta){setToast("Room not found. Check the code.");setConnecting(false);return;}
      await dbSet("/rooms/"+code+"/pending/"+uid,{
        name:profileRef.current.name,avatar:profileRef.current.avatar,
        status:globalStatusRef.current,ts:Date.now()
      });
      setWaitingRoom({code,name:meta.roomName||code});
      setModal(null);setScreen("waiting");
      if(waitUnsubRef.current)waitUnsubRef.current();
      const unsub=dbOn("/rooms/"+code+"/members/"+uid,val=>{
        if(val){
          unsub();waitUnsubRef.current=null;
          dbSet("/users/"+uid+"/rooms/"+code,true);
          subscribeRoom(code,uid);
          setActiveRoom(code);setScreen("board");setWaitingRoom(null);
          setToast("Welcome! You've been approved 🎉");
        }
      });
      const denyUnsub=dbOn("/rooms/"+code+"/pending/"+uid,val=>{
        if(val===null){
          denyUnsub();
          dbGet("/rooms/"+code+"/members/"+uid).then(m=>{
            if(!m){setScreen("home");setWaitingRoom(null);setToast("Your request was denied.");}
          });
        }
      });
      waitUnsubRef.current=()=>{unsub();denyUnsub();};
    }catch(e){setToast("Could not connect.");}
    setConnecting(false);
  }

  async function approveRequest(code,pid){
    const req=rooms[code]&&rooms[code].pending&&rooms[code].pending[pid];
    if(!req)return;
    await dbSet("/rooms/"+code+"/members/"+pid,{...req,ts:Date.now()});
    await dbDel("/rooms/"+code+"/pending/"+pid);
    setToast((req.name||"User")+" approved!");
  }
  async function denyRequest(code,pid){await dbDel("/rooms/"+code+"/pending/"+pid);}

  async function removeMember(code,id){
    await dbDel("/rooms/"+code+"/members/"+id);
    await dbSet("/rooms/"+code+"/members/__kicked/"+id,true);
    await dbDel("/rooms/"+code+"/members/__kicked/"+id);
    await dbDel("/users/"+id+"/rooms/"+code);
    setModal(null);setToast("Member removed.");
  }

  async function leaveRoom(code){
    const uid=uidRef.current;if(!uid)return;
    const isOwner=rooms[code]&&rooms[code].meta&&rooms[code].meta.owner===uid;
    if(pollRefs.current[code]){pollRefs.current[code]();delete pollRefs.current[code];}
    await dbDel("/rooms/"+code+"/members/"+uid);
    await dbDel("/users/"+uid+"/rooms/"+code);
    if(isOwner)await dbDel("/rooms/"+code);
    setRooms(prev=>{const n={...prev};delete n[code];return n;});
    if(activeRoom===code){setActiveRoom(null);setScreen("home");}
  }

  function openRoom(code){
    setActiveRoom(code);setScreen("board");
    setRooms(prev=>({...prev,[code]:{...prev[code],unread:0}}));
    setShowNotif(false);
  }

  /* styles */
  const d=dark;
  const tc=d?"#f0f0f0":"#111";
  const mc=d?"#666":"#888";
  const cbg=d?"#1e1e1e":"#fff";
  const cbr=d?"#2a2a2a":"#e5e5e5";
  const sbg=d?"#161616":"#f2f2f2";
  const appBg=d?"#0a0a0a":"#f0f0f0";
  const sidebarBg=d?"#0f0f0f":"#fff";
  const sidebarBdr=d?"#1e1e1e":"#ebebeb";
  const inp={background:d?"#1e1e1e":"#f8f8f8",color:tc,border:"0.5px solid "+(d?"#333":"#ddd"),borderRadius:10,padding:"9px 12px",width:"100%",fontSize:14,outline:"none"};
  const btn={background:"transparent",color:tc,border:"0.5px solid "+(d?"#333":"#ddd"),borderRadius:10,padding:"8px 16px",fontSize:14,cursor:"pointer"};
  const btnPrimary=(bg,c)=>({...btn,background:bg,color:c||"#fff",border:"none",fontWeight:600});

  const uid=authUser&&authUser.uid;
  const activeRoomData=activeRoom?rooms[activeRoom]:null;
  const roomMembers=activeRoomData?activeRoomData.members||{}:{};
  const roomMeta=activeRoomData?activeRoomData.meta||{}:{};
  const roomPending=activeRoomData?activeRoomData.pending||{}:{};
  const isOwner=roomMeta.owner===uid;
  const myStatusObj=allStatuses().find(s=>s.id===globalStatus)||DEFAULT_STATUSES[0];
  const others=Object.entries(roomMembers).filter(([id,m])=>id!==uid&&id!=="__kicked").sort(([,a],[,b])=>b.ts-a.ts);
  const pendingList=Object.entries(roomPending);
  const roomList=Object.entries(rooms);
  const totalUnread=roomList.reduce((s,[,r])=>s+(r.unread||0),0);
  const unreadNotif=notifications.length;

  /* ── LOADING ── */
  if(authLoading)return<div style={{background:appBg,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:tc}}>
    <div style={{textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12,animation:"pulse 1.5s infinite"}}>📡</div>
      <p style={{color:mc,fontSize:14}}>Loading True Status...</p>
    </div>
  </div>;

  /* ── SIGN IN ── */
  if(!authUser)return(
    <div style={{background:d?"#0a0a0a":"#f0f4ff",height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:tc}}>
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
      <div className="fadein" style={{textAlign:"center",padding:"2rem",maxWidth:380}}>
        <div style={{fontSize:60,marginBottom:16}}>📡</div>
        <h1 style={{fontSize:30,fontWeight:800,marginBottom:8,letterSpacing:-0.5}}>True Status</h1>
        <p style={{color:mc,fontSize:15,marginBottom:36,lineHeight:1.7}}>Let your circle know what you're up to — so they know when to call, when to wait, and when to check in.</p>
        <button onClick={signInGoogle}
          style={{...btn,padding:"13px 28px",fontSize:15,fontWeight:700,background:"#fff",color:"#333",border:"1px solid #ddd",borderRadius:14,boxShadow:"0 2px 12px rgba(0,0,0,.08)",display:"flex",alignItems:"center",gap:12,margin:"0 auto"}}>
          <span style={{fontSize:18,fontWeight:700,color:"#4285F4"}}>G</span> Continue with Google
        </button>
        <p style={{color:mc,fontSize:12,marginTop:20}}>Your account and rooms persist across devices.</p>
      </div>
    </div>
  );

  /* ── WAITING ── */
  if(screen==="waiting")return(
    <div style={{background:appBg,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:tc}}>
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
      <div className="fadein" style={{textAlign:"center",padding:"2rem",maxWidth:360}}>
        <div style={{fontSize:52,marginBottom:20}}>⏳</div>
        <h2 style={{fontSize:22,fontWeight:700,marginBottom:8}}>Waiting for approval</h2>
        <p style={{fontSize:14,color:mc,marginBottom:6}}>Your request to join <strong>{waitingRoom&&waitingRoom.name}</strong> has been sent.</p>
        <p style={{fontSize:13,color:mc,marginBottom:28}}>The admin will approve or deny your request shortly.</p>
        <div style={{display:"flex",alignItems:"center",gap:12,justifyContent:"center",background:cbg,border:"0.5px solid "+cbr,borderRadius:14,padding:"14px 20px",marginBottom:24}}>
          <span style={{fontSize:32}}>{profile.avatar}</span>
          <div style={{textAlign:"left"}}>
            <p style={{fontWeight:600,fontSize:15}}>{profile.name}</p>
            <p style={{fontSize:12,color:mc,marginTop:2}}>Pending approval...</p>
          </div>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"center"}}>
          <button onClick={()=>{
            if(waitUnsubRef.current){waitUnsubRef.current();waitUnsubRef.current=null;}

      {modal==="confirmRemove"&&(
        <Modal dark={d} onClose={()=>setModal(null)}>

            {icon:"→",label:"Join room",action:()=>setModal("join"),bg:d?"#0a0a1f":"#e8f0fb",color:"#378ADD"},

                <button onClick={()=>setModal("join")} style={{...btnPrimary("#378ADD"),padding:"11px 22px",borderRadius:12}}>→ Join a room</button>
              </div>

                        <span style={{fontWeight:700,fontSize:14}}>{m.name}</span>
                        {memOwner&&<span style={{fontSize:12}}>👑</span>}
                        {m.status==="sleeping"&&<Pill text="do not disturb" color="#8B7FE8" bg={d?"#26215C":"#EEEDFE"}/>}
                        {(m.status==="busy"||m.status==="focusing"||m.status==="silent")&&<Pill text="urgent only" color="#D85A30" bg={d?"#4A1B0C":"#FAECE7"}/>}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:15}}>{st.emoji}</span>
                        <span style={{fontSize:13,color:st.color,fontWeight:600}}>{st.label}</span>
                      </div>
                      {m.note&&<p style={{fontSize:12,color:mc,marginTop:3}}>{m.note}</p>}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
                      <span style={{fontSize:11,color:mc}}>{timeAgo(m.ts)}</span>
                      {isOwner&&!memOwner&&(
                        <button onClick={()=>{setModalData({id,name:m.name});setModal("confirmRemove");}}
                          style={{fontSize:11,padding:"3px 8px",borderRadius:6,border:"0.5px solid #E24B4A",color:"#E24B4A",background:"transparent",cursor:"pointer"}}>Remove</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
            <p style={{textAlign:"center",fontSize:11,color:mc,marginTop:24,marginBottom:8}}>⚡ Live updates via Firebase</p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
